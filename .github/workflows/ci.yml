name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  test:
    strategy:
      fail-fast: false
      matrix:
        include:
          - distro: humble
            image: ros:humble-ros-base
            # Humble defaults to Fast DDS — no extra rmw package needed.
            extra_ros_pkgs: ""
            rmw: rmw_fastrtps_cpp
          - distro: jazzy
            image: ros:jazzy-ros-base
            extra_ros_pkgs: "ros-jazzy-rmw-cyclonedds-cpp"
            rmw: rmw_cyclonedds_cpp
    runs-on: ubuntu-latest
    name: test (${{ matrix.distro }})
    container:
      image: ${{ matrix.image }}
    steps:
      - uses: actions/checkout@v4
      - name: Install system deps
        run: |
          apt-get update
          apt-get install -y --no-install-recommends \
            curl ca-certificates build-essential pkg-config git \
            clang libclang-dev cmake python3-pip python3-colcon-common-extensions \
            ros-${{ matrix.distro }}-std-msgs \
            ros-${{ matrix.distro }}-sensor-msgs \
            ros-${{ matrix.distro }}-geometry-msgs \
            ros-${{ matrix.distro }}-nav-msgs \
            ros-${{ matrix.distro }}-diagnostic-msgs \
            ros-${{ matrix.distro }}-tf2-msgs \
            ros-${{ matrix.distro }}-control-msgs \
            ros-${{ matrix.distro }}-trajectory-msgs \
            ros-${{ matrix.distro }}-lifecycle-msgs \
            ros-${{ matrix.distro }}-rcl-interfaces \
            ros-${{ matrix.distro }}-realsense2-camera-msgs \
            ${{ matrix.extra_ros_pkgs }}
      - name: Install Rust 1.88
        run: |
          curl --proto '=https' --tlsv1.2 -sSf https://sh.rustup.rs | \
            sh -s -- -y --default-toolchain 1.88.0 --profile minimal \
                       --component rustfmt --component clippy
          echo "$HOME/.cargo/bin" >> $GITHUB_PATH
      - name: cargo fmt
        run: cargo fmt --all -- --check
      - name: cargo clippy (default)
        run: cargo clippy --workspace --all-targets -- -D warnings
      - name: cargo clippy (live)
        shell: bash
        run: |
          source /opt/ros/${{ matrix.distro }}/setup.bash
          cargo clippy -p rostop-cli --features live --all-targets -- -D warnings
      - name: cargo test (default)
        run: cargo test --workspace --all-targets
      - name: cargo test (live)
        shell: bash
        env:
          RMW_IMPLEMENTATION: ${{ matrix.rmw }}
          ROS_DOMAIN_ID: "0"
          ROS_LOCALHOST_ONLY: "1"
        run: |
          source /opt/ros/${{ matrix.distro }}/setup.bash
          # Live tests share a ROS_DOMAIN_ID and each spawns `ros2 topic pub`,
          # so they must run serially or they race on graph/sample discovery.
          cargo test -p rostop-cli --features live -- --test-threads=1
