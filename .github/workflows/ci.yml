name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  test:
    runs-on: ubuntu-latest
    container:
      image: ros:jazzy-ros-base
    steps:
      - uses: actions/checkout@v4
      - name: Install system deps
        run: |
          apt-get update
          apt-get install -y --no-install-recommends \
            curl ca-certificates build-essential pkg-config git \
            clang libclang-dev cmake python3-pip python3-colcon-common-extensions \
            ros-jazzy-rmw-cyclonedds-cpp ros-jazzy-std-msgs ros-jazzy-sensor-msgs \
            ros-jazzy-geometry-msgs ros-jazzy-nav-msgs ros-jazzy-diagnostic-msgs \
            ros-jazzy-tf2-msgs
      - name: Install Rust 1.88
        run: |
          curl --proto '=https' --tlsv1.2 -sSf https://sh.rustup.rs | \
            sh -s -- -y --default-toolchain 1.88.0 --profile minimal \
                       --component rustfmt --component clippy
          echo "$HOME/.cargo/bin" >> $GITHUB_PATH
      - name: cargo fmt
        run: cargo fmt --all -- --check
      - name: cargo clippy (default)
        run: cargo clippy --workspace --all-targets -- -D warnings
      - name: cargo clippy (live)
        shell: bash
        run: |
          source /opt/ros/jazzy/setup.bash
          cargo clippy -p rostop-cli --features live --all-targets -- -D warnings
      - name: cargo test (default)
        run: cargo test --workspace --all-targets
      - name: cargo test (live)
        shell: bash
        env:
          RMW_IMPLEMENTATION: rmw_cyclonedds_cpp
          ROS_DOMAIN_ID: "0"
        run: |
          source /opt/ros/jazzy/setup.bash
          cargo test -p rostop-cli --features live
