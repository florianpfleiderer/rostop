[workspace]
resolver = "2"
members = ["crates/rostop-core", "crates/rostop-cli"]

[workspace.package]
version = "0.1.0"
edition = "2021"
rust-version = "1.88"
license = "Apache-2.0"
repository = "https://github.com/florianpfleiderer/rostop"
authors = ["Florian Pfleiderer <florian.pfleiderer@agile-robots.com>"]
description = "Interactive TUI for inspecting and debugging ROS2 topics — like htop, for robots."

[workspace.dependencies]
ratatui = "0.29"
crossterm = "0.28"
anyhow = "1"
thiserror = "2"
clap = { version = "4", features = ["derive"] }
tokio = { version = "1", features = ["rt-multi-thread", "macros", "sync", "time", "signal"] }
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter"] }

[profile.release]
lto = "thin"
codegen-units = 1
strip = true
